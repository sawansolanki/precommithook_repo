# ============================================================
#  sonar-project.properties
#  Place this file at the root of your juice-shop project:
#  C:\Users\solan\Documents\juice-shop\juice-shop\sonar-project.properties
# ============================================================

# --- Required: Unique key in SonarQube ---
sonar.projectKey=juice-shop
sonar.projectName=OWASP Juice Shop
sonar.projectVersion=1.0.0

# --- Source & encoding ---
sonar.sources=.
sonar.sourceEncoding=UTF-8

# --- Language hints ---
sonar.language=js

# --- Exclusions: skip noisy folders ---
sonar.exclusions=\
  **/node_modules/**, \
  **/coverage/**, \
  **/dist/**, \
  **/build/**, \
  **/.git/**, \
  **/test/**, \
  **/*.spec.ts, \
  **/*.spec.js, \
  **/*.min.js, \
  **/vendor/**

# --- Test source paths ---
sonar.test.inclusions=**/*.spec.ts,**/*.spec.js,**/test/**

# --- Coverage report (generated by Jest / nyc) ---
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- TypeScript config (Juice Shop uses TS) ---
sonar.typescript.tsconfigPath=tsconfig.json
